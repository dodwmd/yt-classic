server {
  listen 8080;
  server_tokens off;

  client_max_body_size 8k;
  client_header_timeout 15s;
  client_body_timeout 15s;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' https://*.ytimg.com https://yt3.ggpht.com https://yt3.googleusercontent.com; media-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

  # Static assets served directly by nginx (the "frontend")
  location /static/ {
    alias /usr/share/nginx/html/;
    add_header Cache-Control "no-cache" always; # always revalidate (ETag), so CSS/JS edits show up immediately
    add_header X-Content-Type-Options "nosniff" always; # add_header in a location replaces the inherited ones
  }

  # Long-lived video stream: no buffering, generous timeouts
  location /stream/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # Everything else is rendered by the backend
  location / {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s; # a cold home page can wait on several upstream fetches
  }
}
