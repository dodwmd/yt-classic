server {
  listen 8080;
  # Static assets served directly by nginx (the "frontend")
  location /static/ {
    alias /usr/share/nginx/html/;
    add_header Cache-Control "no-cache"; # always revalidate (ETag), so CSS/JS edits show up immediately
  }
  # Everything else is rendered by the backend
  location / {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header Range $http_range;
    proxy_buffering off;
  }
}
