server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;

  client_max_body_size 8k;
  client_header_timeout 15s;
  client_body_timeout 15s;

  # --- The frontend: static pages, revalidated on every load (ETag), so edits show up immediately ---
  location = /        { include /etc/nginx/security-headers.conf; add_header Cache-Control "no-cache" always; try_files /index.html =404; }
  location = /results { include /etc/nginx/security-headers.conf; add_header Cache-Control "no-cache" always; try_files /results.html =404; }
  location = /watch   { include /etc/nginx/security-headers.conf; add_header Cache-Control "no-cache" always; try_files /watch.html =404; }
  location ^~ /channel/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    rewrite ^ /channel.html break; # one page for every channel id; the script reads the id from the URL
  }
  location ^~ /static/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    alias /usr/share/nginx/html/;
  }

  # --- The backend: a JSON API and the video stream ---
  location ^~ /api/ {
    include /etc/nginx/security-headers.conf;
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s; # a cold home page can wait on several upstream fetches
  }
  location = /healthz {
    proxy_pass http://backend:3000;
    proxy_set_header Host $http_host;
  }
  # Long-lived video stream: no buffering, generous timeouts
  location ^~ /stream/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location / { return 404; }
}
