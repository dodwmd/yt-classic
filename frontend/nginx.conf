# Re-resolve "backend" at request time. With a literal `proxy_pass http://backend:3000;` nginx looks the name up once
# at startup, so when the backend container is recreated (new IP) it keeps proxying to the dead address and answers
# 502 until nginx is restarted. With a variable, nginx asks the resolver (and caches for `valid`) instead.
# The nameserver differs per runtime (podman: the network gateway; docker: 127.0.0.11) and nginx can't read
# /etc/resolv.conf itself, so docker-entrypoint.d/05-resolver.sh writes /tmp/resolver.conf from it at container start.
include /tmp/resolver.conf;

# Import uploads are the only large request bodies: bound how many can be in flight (each is buffered in /tmp, a small tmpfs).
limit_conn_zone $binary_remote_addr zone=subs_import_conn:1m;
limit_req_zone $binary_remote_addr zone=subs_import_req:1m rate=6r/m;

# Behind a TLS-terminating proxy this nginx only sees http, so $scheme would overwrite the proxy's X-Forwarded-Proto
# and the session cookie would never get `Secure`. Pass an incoming "https" through; otherwise use our own scheme.
# (A client can only spoof it to add Secure to its own cookie.) conf.d files are included inside `http`, so a map is valid here.
map $http_x_forwarded_proto $fproto {
  default $scheme;
  https   https;
}

server {
  listen 8080;
  set $backend backend:3000; # variable => no startup lookup, so nginx also starts while the backend is down
  server_tokens off;
  root /usr/share/nginx/html;

  client_max_body_size 8k;
  client_header_timeout 15s;
  client_body_timeout 15s;

  # --- The frontend: static pages, revalidated on every load (ETag), so edits show up immediately ---
  location = /        { include /etc/nginx/security-headers.conf; add_header Cache-Control "no-cache" always; try_files /index.html =404; }
  location = /results { include /etc/nginx/security-headers.conf; add_header Cache-Control "no-cache" always; try_files /results.html =404; }
  location = /history { include /etc/nginx/security-headers.conf; add_header Cache-Control "no-cache" always; try_files /history.html =404; }
  location = /subscriptions { include /etc/nginx/security-headers.conf; add_header Cache-Control "no-cache" always; try_files /subscriptions.html =404; }
  location = /watch   { include /etc/nginx/security-headers.conf; add_header Cache-Control "no-cache" always; try_files /watch.html =404; }
  location = /login   { include /etc/nginx/security-headers.conf; add_header Cache-Control "no-cache" always; try_files /login.html =404; }
  location = /status {
    include /etc/nginx/security-headers.conf;
    proxy_pass http://$backend; # rendered by the backend (no JS); same host allow-list as /api
    proxy_set_header Host $http_host;
  }
  location ^~ /channel/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    rewrite ^ /channel.html break; # one page for every channel id; the script reads the id from the URL
  }
  location ^~ /static/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    alias /usr/share/nginx/html/;
  }

  # --- The backend: a JSON API and the video stream ---
  # Subscription import carries a whole subscriptions file; the backend enforces the same 1 MB cap.
  location = /api/subscriptions/import {
    include /etc/nginx/security-headers.conf;
    client_max_body_size 1m;
    client_body_timeout 30s;
    limit_conn subs_import_conn 2;
    limit_req zone=subs_import_req burst=6 nodelay;
    proxy_pass http://$backend;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location ^~ /api/ {
    include /etc/nginx/security-headers.conf;
    proxy_pass http://$backend;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $fproto;
    proxy_read_timeout 120s; # a cold home page can wait on several upstream fetches
  }
  location = /healthz {
    proxy_pass http://$backend;
    proxy_set_header Host $http_host;
  }
  # Long-lived video stream: no buffering, generous timeouts
  location ^~ /stream/ {
    proxy_pass http://$backend;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $fproto;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location / { return 404; }
}
