<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Playlists - YouTube Classic</title>
<link rel="stylesheet" href="/static/classic.css">
<link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
<script type="module" src="/static/js/playlists.js"></script>
</head>
<body>
<div id="masthead">
  <a id="logo" href="/">You<span>Tube</span></a>
  <a id="tvlink" href="/tv">TV</a>
  <form action="/results" method="get">
    <input type="text" name="search_query" id="q" aria-label="Search">
    <button type="submit">Search</button>
  </form>
</div>
<div id="page">
  <noscript><p>This page needs JavaScript to load its data.</p></noscript>
  <p id="status" role="status">Loading&hellip;</p>
  <p id="err" role="alert" hidden></p>
  <div id="lists" hidden>
    <h2>Playlists</h2>
    <form id="pl-new">
      <input type="text" id="new-name" maxlength="80" required aria-label="New playlist name">
      <button type="submit">Create playlist</button>
    </form>
    <ul class="pl" id="pl-list"></ul>
  </div>
  <div id="list" hidden>
    <h2 id="pl-title"></h2>
    <div id="pl-bar">
      <a id="play" href="/playlists" hidden>Play</a>
      <a href="/playlists">All playlists</a>
    </div>
    <p id="none" hidden>Nothing here yet. Use the + on any video to add it.</p>
    <div class="grid" id="pl-grid"></div>
    <p><button type="button" id="more" hidden>Load more</button></p>
  </div>
</div>
<template id="t-card">
  <div class="card">
    <a class="thumb"><img width="160" height="90" alt=""><span class="dur" hidden></span></a>
    <a class="title"></a>
    <div class="sub"><a class="chan" hidden></a><span class="byline" hidden></span><br><span class="meta"></span></div>
  </div>
</template>
<template id="t-pl">
  <li>
    <a class="name"></a>
    <span class="count"></span>
    <button type="button" class="ren">Rename</button>
    <button type="button" class="del">Delete</button>
  </li>
</template>
<footer id="foot" hidden><form method="post" action="/api/logout"><button type="submit">Log out</button></form></footer>
</body>
</html>
