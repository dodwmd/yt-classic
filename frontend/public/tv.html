<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV - YouTube Classic</title>
<link rel="stylesheet" href="/static/classic.css">
<link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
<script type="module" src="/static/js/tv.js"></script>
</head>
<body>
<div id="masthead">
  <a id="logo" href="/">You<span>Tube</span></a>
  <a id="tvlink" href="/tv" aria-current="page">TV</a>
  <form action="/results" method="get">
    <input type="text" name="search_query" id="q" aria-label="Search">
    <button type="submit">Search</button>
  </form>
</div>
<div id="page">
  <noscript><p>This page needs JavaScript to load its data.</p></noscript>
  <p id="status" role="status">Loading&hellip;</p>
  <div id="tvbox" hidden>
    <div id="player">
      <video controls autoplay preload="auto" width="640" height="360">Your browser can't play this video.</video>
      <div class="controls" hidden>
        <button class="pp" type="button" aria-label="Play or pause">&#9654;</button>
        <input class="bar" type="range" aria-label="Seek" min="0" max="0" step="1" value="0">
        <span class="time"></span>
        <input class="vol" type="range" aria-label="Volume" min="0" max="1" step="0.05" value="1">
        <button class="fs" type="button" aria-label="Fullscreen">&#9974;</button>
      </div>
    </div>
    <p id="np" aria-live="polite"><b>Now playing:</b> <span id="np-title"></span> &middot; <a id="np-chan"></a></p>
    <p id="tv-actions"><button type="button" id="skip">Skip</button> <button type="button" id="stop">Stop</button></p>
  </div>
  <p id="tv-end" role="status" hidden><span id="tv-msg"></span> <a href="/">Back to home</a></p>
</div>
<footer id="foot" hidden><form method="post" action="/api/logout"><button type="submit">Log out</button></form></footer>
</body>
</html>
