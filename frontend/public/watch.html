<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watch - YouTube Classic</title>
<link rel="stylesheet" href="/static/classic.css">
<link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
<script type="module" src="/static/js/watch.js"></script>
</head>
<body>
<div id="masthead">
  <a id="logo" href="/">You<span>Tube</span></a>
  <a id="tvlink" href="/tv">TV</a>
  <form action="/results" method="get">
    <input type="text" name="search_query" id="q" aria-label="Search">
    <button type="submit">Search</button>
  </form>
</div>
<div id="page">
  <noscript><p>This page needs JavaScript to load its data.</p></noscript>
  <p id="status" role="status">Loading&hellip;</p>
  <button id="try" type="button" hidden>Try anyway</button>
  <div id="watch" hidden>
    <div id="main">
      <h1 id="title"></h1>
      <div id="later-box"></div>
      <div id="player" hidden>
        <video controls autoplay preload="auto" width="640" height="360">Your browser can't play this video.</video>
        <div class="controls" hidden>
          <button class="pp" type="button" aria-label="Play or pause">&#9654;</button>
          <input class="bar" type="range" aria-label="Seek" min="0" max="0" step="1" value="0">
          <span class="time"></span>
          <span class="chap" id="ch-name"></span>
          <input class="vol" type="range" aria-label="Volume" min="0" max="1" step="0.05" value="1">
          <button class="fs" type="button" aria-label="Fullscreen">&#9974;</button>
        </div>
      </div>
      <div class="quality">Quality: <span id="quality" role="group" aria-label="Video quality"></span></div>
      <div class="info">
        <div class="by">Uploaded by <a id="chan"></a> <span id="age"></span></div>
        <div class="views" id="views"></div>
      </div>
      <details id="chapters" hidden><summary id="ch-sum">Chapters</summary><ol id="ch-list" role="list"></ol></details>
      <details open><summary>Description</summary><div class="desc" id="desc"></div></details>
      <section id="comments">
        <button id="cm-open" type="button" aria-expanded="false" aria-controls="cm-body">Show comments</button> <span id="cm-fail" role="status"></span>
        <div id="cm-body" hidden>
          <div id="cm-order" role="group" aria-label="Sort comments"><button type="button" data-o="top" aria-pressed="true">Top</button><button type="button" data-o="new" aria-pressed="false">Newest</button></div>
          <div id="cm-list"></div>
          <p id="cm-msg" role="status"></p>
          <button id="cm-more" type="button" data-label="Load more" hidden>Load more</button>
        </div>
      </section>
    </div>
    <div id="related">
      <h3 id="rel-heading"></h3>
      <div id="rel-list"></div>
    </div>
  </div>
</div>
<template id="t-rel">
  <div class="rel">
    <a class="thumb"><img width="120" height="68" alt=""><span class="dur" hidden></span></a>
    <div>
      <a class="title"></a>
      <div class="sub"><span class="chan"></span><br><span class="meta"></span></div>
    </div>
  </div>
</template>
<template id="t-comment">
  <div class="cm">
    <img class="av" width="32" height="32" alt="">
    <div class="cb">
      <div class="ch"><a class="au"></a> <span class="ag"></span></div>
      <div class="ct"></div>
      <div class="cf"><span class="lk"></span> <button class="rp" type="button" aria-expanded="false" hidden></button></div>
      <div class="rl" hidden>
        <div class="rb"></div>
        <p class="rs" role="status"></p>
        <button class="rm" type="button" data-label="Show more replies">Show more replies</button>
      </div>
    </div>
  </div>
</template>
<footer id="foot" hidden><form method="post" action="/api/logout"><button type="submit">Log out</button></form></footer>
</body>
</html>
