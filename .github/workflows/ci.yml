# Continuous integration: runs on pull requests only (not on pushes to main).
# Deployment lives in cd.yml.
name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit and integration tests
        run: npm test

  frontend:
    name: Frontend lint, tests and JS budget
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests (formatters, template lookups, JS size and safety guardrails)
        run: npm test

  codeql:
    name: Static analysis (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript

  security:
    name: Security (secrets, dependencies, Containerfiles)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # secret scan covers the whole history

      - name: Secret scan (gitleaks)
        run: |
          # safe.directory: the checkout is owned by the runner user, not the container's root.
          # Without it git refuses the repo and gitleaks "succeeds" having scanned nothing.
          out=$(docker run --rm \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            detect --source /repo --redact --verbose 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          if ! echo "$out" | grep -qE "[1-9][0-9]* commits scanned"; then
            echo "::error::gitleaks did not report scanning any commits"; exit 1
          fi

      - name: Lint backend Containerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: backend/Containerfile
          ignore: DL3008 # apt packages follow the pinned base image's release
      - name: Lint frontend Containerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: frontend/Containerfile

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Dependency audit (runtime deps any severity; all deps high and above)
        run: |
          for dir in backend frontend; do
            (cd "$dir" && npm ci && npm audit --omit=dev && npm audit --audit-level=high)
          done

      - name: Dependency review (new or changed dependencies in this PR)
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  build:
    name: Build images (docker compose build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Provide the env file compose expects (dummy; the key is not needed to build)
        run: cp backend/.env.example backend/.env
      - name: docker compose build
        run: docker compose build
