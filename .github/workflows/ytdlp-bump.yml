# Keeps the pinned yt-dlp (backend/Containerfile and shell.nix) fresh. YouTube changes break old yt-dlp releases, and
# Dependabot cannot see this pin. Weekly (and on demand) this finds the latest release, checks it is at least
# `min_age_hours` old (default 48), verifies the binary against the release's SHA2-256SUMS and, when the release ships
# SHA2-256SUMS.sig, the signature against the committed yt-dlp signing key, smoke-tests it against a real public video
# and opens a pull request. The smoke test is advisory: YouTube often bot-checks GitHub's data-centre IPs, so an
# "inconclusive" result still opens the PR (and says so); a real failure (crash, no URL) does not.
#
# It never merges anything. IMPORTANT limitation: pull requests created with the default GITHUB_TOKEN do not trigger other
# workflows, so CI does not start on the bot's PR and the required checks stay "Expected". Either close and reopen the PR
# (or push an empty commit to the branch from your own account) to start CI, or add a repository secret YTDLP_BUMP_TOKEN
# (a fine-grained PAT with contents + pull requests write on this repo); with it, CI starts by itself. The PR still needs
# its required checks and review like any other. See the README.
name: Bump yt-dlp

on:
  schedule:
    - cron: "17 5 * * 1" # Mondays 05:17 UTC
  workflow_dispatch:
    inputs:
      min_age_hours:
        description: Do not bump to a release younger than this many hours (a window for a bad release to be pulled)
        default: "48"
        required: false

permissions: {}

concurrency:
  group: ytdlp-bump
  cancel-in-progress: false

jobs:
  smoke:
    name: Find latest release, verify and smoke-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.latest.outputs.version }}
      changed: ${{ steps.latest.outputs.changed }}
      sha256: ${{ steps.latest.outputs.sha256 }}
      signature: ${{ steps.latest.outputs.signature }}
      smoke: ${{ steps.smoke.outputs.smoke }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false # an untrusted binary runs in this job: leave no token in .git/config
      - name: Download the latest release and verify it
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          MIN_AGE_HOURS: ${{ inputs.min_age_hours || '48' }}
        run: |
          set -eu
          tag=$(gh api repos/yt-dlp/yt-dlp/releases/latest --jq .tag_name)
          # Validate before the tag goes anywhere near GITHUB_OUTPUT, a command line or a branch name.
          printf '%s\n' "$tag" | grep -Eq '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$' || { echo "::error::unexpected release tag format"; exit 1; }
          printf '%s\n' "$MIN_AGE_HOURS" | grep -Eq '^[0-9]{1,5}$' || { echo "::error::min_age_hours must be a number"; exit 1; }
          current=$(sed -n 's/^ARG YTDLP_VERSION=//p' backend/Containerfile)
          echo "latest release: $tag, pinned: $current"
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          if [ "$tag" = "$current" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date ($tag)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          published=$(gh api repos/yt-dlp/yt-dlp/releases/latest --jq .published_at)
          age_hours=$(( ($(date +%s) - $(date -d "$published" +%s)) / 3600 ))
          if [ "$age_hours" -lt "$MIN_AGE_HOURS" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Release $tag is ${age_hours}h old; waiting until it is ${MIN_AGE_HOURS}h old. The next run will pick it up." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/dl"
          gh release download "$tag" -R yt-dlp/yt-dlp -p yt-dlp -p SHA2-256SUMS -D "$RUNNER_TEMP/dl"
          sig=absent
          if gh release download "$tag" -R yt-dlp/yt-dlp -p SHA2-256SUMS.sig -D "$RUNNER_TEMP/dl" 2>/dev/null; then sig=verified; fi
          echo "signature=$sig" >> "$GITHUB_OUTPUT"
          if [ "$sig" = absent ]; then echo "::warning::release $tag ships no SHA2-256SUMS.sig; only the checksum was verified"; fi
          # Verifies the checksum (and the signature, if any), refusing on a mismatch, while editing a scratch copy.
          mkdir -p "$RUNNER_TEMP/scratch"
          cp backend/Containerfile "$RUNNER_TEMP/scratch/Containerfile"
          cp shell.nix "$RUNNER_TEMP/scratch/shell.nix"
          if [ "$sig" = verified ]; then SUMS_SIG="$RUNNER_TEMP/dl/SHA2-256SUMS.sig"; export SUMS_SIG; fi
          sh scripts/bump-ytdlp.sh "$tag" "$RUNNER_TEMP/dl/SHA2-256SUMS" "$RUNNER_TEMP/dl/yt-dlp" \
            "$RUNNER_TEMP/scratch/Containerfile" "$RUNNER_TEMP/scratch/shell.nix"
          chmod +x "$RUNNER_TEMP/dl/yt-dlp"
          echo "sha256=$(sha256sum "$RUNNER_TEMP/dl/yt-dlp" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Smoke test (resolve a stream URL for a public video with the new binary)
        id: smoke
        if: steps.latest.outputs.changed == 'true'
        run: |
          rc=0
          sh scripts/smoke-ytdlp.sh "$RUNNER_TEMP/dl/yt-dlp" jNQXAC9IVRw || rc=$?
          case "$rc" in
            0) echo "smoke=passed" >> "$GITHUB_OUTPUT" ;;
            3) echo "smoke=inconclusive" >> "$GITHUB_OUTPUT"
               echo "::warning::smoke test inconclusive (YouTube blocked or rate-limited this runner); the PR will say so" ;;
            *) echo "::error::smoke test failed for a reason other than a bot-check: a real regression in this yt-dlp release"
               exit 1 ;;
          esac

  pr:
    name: Open or update the pull request
    needs: smoke
    if: needs.smoke.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the bot/yt-dlp-<version> branch
      pull-requests: write # open or update the PR
    env:
      VERSION: ${{ needs.smoke.outputs.version }}
      TESTED_SHA256: ${{ needs.smoke.outputs.sha256 }}
      SIGNATURE: ${{ needs.smoke.outputs.signature }}
      SMOKE: ${{ needs.smoke.outputs.smoke }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # A PAT-pushed branch and PR start CI; the default token's do not (see the header).
          token: ${{ secrets.YTDLP_BUMP_TOKEN || github.token }}
      - name: Download again and verify (this job trusts nothing from the previous one)
        id: bump
        env:
          GH_TOKEN: ${{ github.token }} # a public repo: never hand the PAT to the downloader
        run: |
          set -eu
          printf '%s\n' "$VERSION" | grep -Eq '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$' || { echo "::error::unexpected version"; exit 1; }
          mkdir -p "$RUNNER_TEMP/dl"
          gh release download "$VERSION" -R yt-dlp/yt-dlp -p yt-dlp -p SHA2-256SUMS -D "$RUNNER_TEMP/dl"
          # The binary that gets pinned must be byte-for-byte the one the smoke job tested.
          got=$(sha256sum "$RUNNER_TEMP/dl/yt-dlp" | cut -d' ' -f1)
          [ "$got" = "$TESTED_SHA256" ] || { echo "::error::the release asset changed between the jobs ($got != $TESTED_SHA256); refusing"; exit 1; }
          if [ "$SIGNATURE" = verified ]; then
            gh release download "$VERSION" -R yt-dlp/yt-dlp -p SHA2-256SUMS.sig -D "$RUNNER_TEMP/dl"
            SUMS_SIG="$RUNNER_TEMP/dl/SHA2-256SUMS.sig"
            export SUMS_SIG
          fi
          out=$(sh scripts/bump-ytdlp.sh "$VERSION" "$RUNNER_TEMP/dl/SHA2-256SUMS" "$RUNNER_TEMP/dl/yt-dlp")
          echo "bump script: $out"
          echo "result=$out" >> "$GITHUB_OUTPUT"
      - name: Commit, push and open or update the PR
        if: steps.bump.outputs.result == 'updated'
        env:
          GH_TOKEN: ${{ secrets.YTDLP_BUMP_TOKEN || github.token }}
          USING_PAT: ${{ secrets.YTDLP_BUMP_TOKEN != '' }}
        run: |
          set -eu
          branch="bot/yt-dlp-$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add backend/Containerfile shell.nix
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Bump yt-dlp to $VERSION"
          git push --force origin "$branch" # our own bot branch, rebuilt from main on every run
          if [ "$SMOKE" = passed ]; then
            smoke_line="Smoke test: **passed**. The new binary resolved a stream URL for a public video (\`jNQXAC9IVRw\`) on the Actions runner."
          else
            smoke_line="Smoke test: **inconclusive** (bot-check or rate limit from a data-centre IP). The new binary could not be exercised against YouTube from the runner; try it locally (\`yt-dlp -g <url>\`) before merging."
          fi
          if [ "$SIGNATURE" = verified ]; then
            sig_line="Authenticity: the release's \`SHA2-256SUMS.sig\` is a valid signature by the yt-dlp signing key committed in \`scripts/yt-dlp-release.pub\`."
          else
            sig_line="Authenticity: **not verified**: this release ships no \`SHA2-256SUMS.sig\`. Only the checksum was checked."
          fi
          {
            echo "Bumps the pinned yt-dlp to [$VERSION](https://github.com/yt-dlp/yt-dlp/releases/tag/$VERSION) in \`backend/Containerfile\` and \`shell.nix\`."
            echo
            echo "- Integrity verified against the release's \`SHA2-256SUMS\` (the same trust root as the release itself) by \`scripts/bump-ytdlp.sh\`, which refuses to pin otherwise."
            echo "- $sig_line"
            echo "- $smoke_line"
            echo "- The release was at least 48 hours old (or the dispatcher's chosen minimum) when this ran."
            echo "- Not tested here: age-restricted, region-blocked and live videos. Check \`/status\` after deploying."
            echo
            if [ "$USING_PAT" = true ]; then
              echo "CI was started by the token that opened this PR. It needs its required checks and a review like any other PR."
            else
              echo "**CI has not run.** A PR opened with \`GITHUB_TOKEN\` does not trigger workflows, so the required checks are still pending. Close and reopen this PR (or push an empty commit to \`$branch\` from your account) to start them. To avoid this step, add a \`YTDLP_BUMP_TOKEN\` secret (see the README)."
            fi
            echo
            echo "Opened by \`.github/workflows/ytdlp-bump.yml\`."
          } > "$RUNNER_TEMP/body.md"
          title="Bump yt-dlp to $VERSION"
          existing=$(gh pr list --head "$branch" --state open --json number,isCrossRepository --jq '[.[] | select(.isCrossRepository == false)][0].number // empty')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --base main --head "$branch" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi
          # An older open bump PR from this repository (never a fork's) is superseded by this one.
          gh pr list --state open --json number,headRefName,isCrossRepository \
            --jq ".[] | select(.isCrossRepository == false) | select(.headRefName | startswith(\"bot/yt-dlp-\")) | select(.headRefName != \"$branch\") | .number" |
            while read -r old; do
              gh pr close "$old" --delete-branch --comment "Superseded by the bump to $VERSION."
            done
